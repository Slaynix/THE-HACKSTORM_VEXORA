<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Sanchay+ AI Assistant — Multilingual Conversational Micro-Savings Companion." />
  <title>Assistant | Sanchay+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/output.css" />
  <style>
    /* Custom styles for chat scroll and pulse */
    .chat-container {
      height: calc(100vh - 180px);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .listening-pulse {
      animation: pulse-ring 1.5s infinite ease-in-out;
    }
    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body class="bg-emerald-50/40 min-h-screen text-gray-900 flex flex-col font-sans">

  <!-- ── Top App Bar ────────────────────────────────────────────────────────── -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-gray-100 px-4 py-3 shadow-sm">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="p-2 -ml-2 rounded-xl text-gray-600 hover:bg-gray-100 active:scale-95 transition-all min-h-[44px] min-w-[44px] flex items-center justify-center" aria-label="Go back to Dashboard">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-sm font-bold text-lg">
            🤖
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-sm font-bold text-gray-900" data-i18n="assistant.title">Sanchay+ Assistant</h1>
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Online"></span>
            </div>
            <p class="text-[11px] text-gray-500 font-medium" data-i18n="assistant.subtitle">Voice & Text Companion</p>
          </div>
        </div>
      </div>

      <!-- Action buttons: Drawer, Mute toggle & Language badge -->
      <div class="flex items-center gap-2">
        <button id="btn-open-drawer" class="btn-open-drawer px-2.5 py-1.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm active:scale-95" aria-label="Open All Features Menu">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span class="hidden sm:inline">Features</span>
        </button>
        <button
          type="button"
          id="toggle-voice-mute"
          class="p-2 rounded-xl border border-gray-200 text-gray-700 hover:bg-gray-50 active:scale-95 transition-all flex items-center justify-center min-h-[40px] min-w-[40px]"
          title="Toggle Voice Output"
          aria-label="Toggle voice output"
        >
          <span id="voice-mute-icon" class="text-lg">🔊</span>
        </button>
        <span id="chat-lang-badge" class="px-2.5 py-1 rounded-xl bg-emerald-100 text-emerald-800 text-xs font-bold uppercase tracking-wider">
          EN
        </span>
      </div>
    </div>
  </header>

  <!-- ── Main Chat Area ─────────────────────────────────────────────────────── -->
  <main class="flex-1 max-w-lg w-full mx-auto px-4 py-3 flex flex-col justify-between overflow-hidden">
    
    <!-- Messages Scrollable Container -->
    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3.5 pr-1 pb-4" role="log" aria-live="polite">
      
      <!-- Welcome Message Bubble from Assistant -->
      <div class="flex items-start gap-2.5 max-w-[90%] assistant-bubble">
        <div class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-sm shrink-0 font-bold mt-1">
          🤖
        </div>
        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 shadow-sm space-y-2">
          <p class="text-sm text-gray-800 leading-relaxed" data-i18n="assistant.welcome">
            Namaste! How can I help with your family savings today? You can speak or type in any language.
          </p>
        </div>
      </div>

      <!-- Suggested Quick Prompt Chips -->
      <div id="quick-chips" class="flex flex-wrap gap-2 pt-1">
        <button type="button" class="quick-chip px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold hover:bg-emerald-100 active:scale-95 transition-all" data-prompt="I saved ₹50 for school fees">
          💰 Saved ₹50
        </button>
        <button type="button" class="quick-chip px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold hover:bg-emerald-100 active:scale-95 transition-all" data-prompt="How is my school fees progress?">
          📊 School Fees status
        </button>
        <button type="button" class="quick-chip px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold hover:bg-emerald-100 active:scale-95 transition-all" data-prompt="What are my goals?">
          🎯 What are my goals?
        </button>
        <button type="button" class="quick-chip px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold hover:bg-emerald-100 active:scale-95 transition-all" data-prompt="Give me a savings tip">
          💡 Saving tip
        </button>
      </div>

      <!-- Thinking Indicator (Hidden by default) -->
      <div id="thinking-indicator" class="hidden flex items-center gap-2 max-w-[80%]">
        <div class="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-sm shrink-0 font-bold">
          🤖
        </div>
        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-600 typing-dot"></span>
          <span class="w-2 h-2 rounded-full bg-emerald-600 typing-dot"></span>
          <span class="w-2 h-2 rounded-full bg-emerald-600 typing-dot"></span>
          <span class="text-xs text-gray-500 font-medium ml-1.5" data-i18n="assistant.thinking">Thinking…</span>
        </div>
      </div>

    </div>

    <!-- Voice Listening Active Banner (Hidden by default) -->
    <div id="voice-banner" class="hidden mb-2 p-3 rounded-2xl bg-emerald-600 text-white shadow-md flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-white listening-pulse"></span>
        <span class="text-xs font-bold" data-i18n="assistant.listening">Listening… Speak in your language</span>
      </div>
      <button type="button" id="cancel-voice-btn" class="text-xs bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-xl font-bold">
        Stop
      </button>
    </div>

    <!-- ── Input Dock ────────────────────────────────────────────────────────── -->
    <div class="sticky bottom-0 bg-white/95 backdrop-blur-md rounded-2xl border border-gray-200 shadow-lg p-2 flex items-center gap-2">
      <!-- Microphone Button -->
      <button
        type="button"
        id="mic-btn"
        class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 active:scale-95 flex items-center justify-center shrink-0 border border-emerald-200 transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500"
        title="Voice Input"
        aria-label="Start voice input"
      >
        <span id="mic-icon" class="text-2xl">🎙️</span>
      </button>

      <!-- Text Input -->
      <input
        type="text"
        id="chat-input"
        class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all min-h-[44px]"
        placeholder="Ask anything or say 'Saved ₹50'..."
        data-i18n-placeholder="assistant.placeholder"
        autocomplete="off"
      />

      <!-- Send Button -->
      <button
        type="button"
        id="send-btn"
        class="w-11 h-11 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 active:scale-95 flex items-center justify-center shrink-0 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 min-h-[44px] min-w-[44px]"
        title="Send Message"
        aria-label="Send message"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </div>

  </main>

  <script type="module" src="../js/assistant.js"></script>
  <script type="module" src="../js/drawer.js"></script>
</body>
</html>
