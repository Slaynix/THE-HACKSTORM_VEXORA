<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sanchay+ — Smart Micro-Savings Companion for rural families. Create savings goals, track progress, and achieve your dreams." />
  <title>Sanchay+ | Smart Micro-Savings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/output.css" />
</head>
<body class="bg-emerald-50/40 text-gray-900 font-sans min-h-screen flex flex-col">

  <!-- ── Landing page ──────────────────────────────────────────────────────── -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-md mx-auto w-full">

    <!-- Hero -->
    <section class="text-center mb-10" aria-label="Hero">
      <!-- Coin / piggy-bank illustration (CSS art, no placeholder image) -->
      <div class="relative w-28 h-28 mx-auto mb-6">
        <div class="absolute inset-0 bg-emerald-200 rounded-full animate-pulse opacity-40"></div>
        <div class="absolute inset-2 bg-emerald-100 rounded-full flex items-center justify-center shadow-inner">
          <span class="text-5xl" role="img" aria-label="Savings">🪙</span>
        </div>
      </div>

      <h1 id="landing-app-name" class="text-4xl font-black text-emerald-800 tracking-tight mb-2" data-i18n="landing.appName">Sanchay+</h1>
      <p id="landing-tagline" class="text-base sm:text-lg text-gray-600 font-semibold" data-i18n="landing.tagline">Small savings. Big goals.</p>
    </section>

    <!-- CTAs -->
    <section class="w-full space-y-3 mb-10" aria-label="Actions">
      <a id="btn-start-saving" href="pages/onboarding.html" class="btn-primary w-full text-center text-lg py-4 shadow-md min-h-[48px]" data-i18n="landing.startSaving">
        Start Saving
      </a>
      <a id="btn-login" href="pages/dashboard.html" class="btn-secondary w-full text-center py-3.5 min-h-[48px]" data-i18n="landing.login">
        I already have an account
      </a>
    </section>

    <!-- Language picker -->
    <section class="w-full" aria-label="Language selection">
      <p id="landing-choose-lang" class="text-xs font-bold uppercase tracking-wider text-gray-400 text-center mb-3" data-i18n="landing.chooseLanguage">Choose your language</p>
      <div class="grid grid-cols-3 gap-2.5" id="lang-picker">
        <button data-lang="en" class="lang-btn btn-ghost border-2 border-gray-200 rounded-2xl py-3 text-center font-bold text-sm min-h-[48px] transition-all active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500" aria-label="English">
          English
        </button>
        <button data-lang="hi" class="lang-btn btn-ghost border-2 border-gray-200 rounded-2xl py-3 text-center font-bold text-sm min-h-[48px] transition-all active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500" aria-label="Hindi">
          हिंदी
        </button>
        <button data-lang="mr" class="lang-btn btn-ghost border-2 border-gray-200 rounded-2xl py-3 text-center font-bold text-sm min-h-[48px] transition-all active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500" aria-label="Marathi">
          मराठी
        </button>
      </div>
    </section>
  </main>

  <footer class="text-center text-xs text-gray-400 py-4" data-i18n="settings.appVersion">Sanchay+ v1.0.0</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
