<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new savings goal — Sanchay+." />
  <title>Create Goal | Sanchay+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/output.css" />
</head>
<body class="bg-emerald-50/40 min-h-screen text-gray-900">

  <main class="max-w-lg mx-auto px-4 pt-5 pb-12">

    <!-- Header with Back navigation -->
    <header class="flex items-center justify-between gap-3 mb-6">
      <div class="flex items-center gap-3">
        <a href="goals.html" class="p-2 -ml-2 rounded-xl text-gray-600 hover:bg-gray-100 active:scale-95 transition-all min-h-[44px] min-w-[44px] flex items-center justify-center" aria-label="Go back to Goals">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
          <h1 class="text-xl font-extrabold text-gray-900" data-i18n="createGoal.title">Create a Goal</h1>
          <p class="text-xs text-gray-500" data-i18n="createGoal.deadlineHint">Set your target and date to stay on track</p>
        </div>
      </div>
      <button id="btn-open-drawer" class="btn-open-drawer px-2.5 py-1 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition-all flex items-center gap-1 shadow-sm active:scale-95" aria-label="Open All Features Menu">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span>Menu</span>
      </button>
    </header>

    <form id="create-goal-form" class="space-y-5" novalidate>

      <!-- Category Picker -->
      <section class="card">
        <label class="form-label font-bold text-gray-900 mb-2.5" data-i18n="createGoal.pickCategory">What are you saving for?</label>
        <div id="category-grid" class="grid grid-cols-4 gap-2 sm:grid-cols-4">
          <button type="button" class="category-card" data-category="education" data-default-name="School Fees" data-default-amount="15000">
            <span class="category-card-icon">📚</span>
            <span class="category-card-label" data-i18n="createGoal.catEducation">Education</span>
          </button>
          <button type="button" class="category-card" data-category="phone" data-default-name="New Phone" data-default-amount="10000">
            <span class="category-card-icon">📱</span>
            <span class="category-card-label" data-i18n="createGoal.catPhone">Phone</span>
          </button>
          <button type="button" class="category-card" data-category="festival" data-default-name="Diwali Celebration" data-default-amount="5000">
            <span class="category-card-icon">🎉</span>
            <span class="category-card-label" data-i18n="createGoal.catFestival">Festival</span>
          </button>
          <button type="button" class="category-card" data-category="farming" data-default-name="Farming Seeds & Tools" data-default-amount="20000">
            <span class="category-card-icon">🌾</span>
            <span class="category-card-label" data-i18n="createGoal.catFarming">Farming</span>
          </button>
          <button type="button" class="category-card" data-category="home" data-default-name="Home Repair" data-default-amount="50000">
            <span class="category-card-icon">🏠</span>
            <span class="category-card-label" data-i18n="createGoal.catHome">Home</span>
          </button>
          <button type="button" class="category-card" data-category="emergency" data-default-name="Emergency Fund" data-default-amount="10000">
            <span class="category-card-icon">🏥</span>
            <span class="category-card-label" data-i18n="createGoal.catEmergency">Emergency</span>
          </button>
          <button type="button" class="category-card col-span-2 sm:col-span-2" data-category="other" data-default-name="Special Goal" data-default-amount="5000">
            <span class="category-card-icon">🎯</span>
            <span class="category-card-label" data-i18n="createGoal.catOther">Other</span>
          </button>
        </div>
      </section>

      <!-- Goal Name -->
      <section class="card">
        <label for="goal-name" class="form-label font-bold text-gray-900 mb-1" data-i18n="createGoal.goalName">Goal Name</label>
        <input
          type="text"
          id="goal-name"
          name="name"
          class="form-input bg-white text-base font-semibold"
          placeholder="e.g. Farming Equipment"
          data-i18n-placeholder="createGoal.namePlaceholder"
          required
        />
      </section>

      <!-- Target Amount -->
      <section class="card">
        <div class="flex items-center justify-between mb-1.5">
          <label for="goal-amount" class="form-label font-bold text-gray-900 mb-0" data-i18n="createGoal.targetAmount">Target Amount (₹)</label>
          <span id="amount-preview" class="text-sm font-extrabold text-emerald-700"></span>
        </div>
        <div class="relative rounded-xl shadow-sm">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500 font-bold text-lg">
            ₹
          </div>
          <input
            type="number"
            id="goal-amount"
            name="targetAmount"
            class="form-input pl-9 bg-white text-lg font-bold"
            placeholder="20,000"
            data-i18n-placeholder="createGoal.amountPlaceholder"
            min="100"
            step="50"
            required
          />
        </div>
      </section>

      <!-- Deadline Date -->
      <section class="card">
        <label for="goal-deadline" class="form-label font-bold text-gray-900 mb-1" data-i18n="createGoal.deadline">Target Date</label>
        <input
          type="date"
          id="goal-deadline"
          name="deadline"
          class="form-input bg-white text-sm"
          required
        />
        <p class="text-[11px] text-gray-500 mt-1" data-i18n="createGoal.deadlineHint">Must be a future date</p>
      </section>

      <!-- Submit CTA -->
      <div class="pt-2">
        <button
          type="submit"
          id="create-goal-btn"
          class="btn-primary w-full text-base py-3.5 shadow-md disabled:opacity-50 disabled:cursor-not-allowed min-h-[48px]"
          disabled
        >
          <span data-i18n="createGoal.create">Create Goal</span> 🎯
        </button>
        <a href="goals.html" class="block text-center text-xs font-semibold text-gray-500 mt-3 py-2 hover:underline min-h-[44px] flex items-center justify-center" data-i18n="common.cancel">
          Cancel
        </a>
      </div>

    </form>

  </main>

  <script type="module">
    import { initCreateGoalForm } from '../js/goals.js';
    initCreateGoalForm();
  </script>
  <script type="module" src="../js/drawer.js"></script>
</body>
</html>
